<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moeda Estudantil - Avaliar Transferências</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .aval-wrap { max-width: 820px; margin: 2rem auto; padding: 0 1rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .aval-card { background: var(--bg-white); border: 1px solid var(--border-yellow); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden; }
    .aval-topo { padding: 1.35rem 1.5rem; background: var(--primary-subtle); border-bottom: 1px solid var(--border-yellow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .aval-topo h1 { font-size: 1.15rem; color: var(--primary-deep); }
    .aval-topo small { color: var(--text-muted); display: block; margin-top: 2px; }
    .link-criterios { text-decoration: none; font-size: .84rem; font-weight: 600; color: var(--primary-deep); background: #fff; border: 1px solid var(--border-yellow); padding: .45rem .85rem; border-radius: var(--radius-md); }
    .link-criterios:hover { background: var(--primary-bg); }
    .aval-barra { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .75rem; }
    .aval-barra select { padding: .45rem .7rem; border: 1px solid var(--border-yellow); border-radius: var(--radius-sm); font: inherit; background: #fff; }
    #feedback { font-size: .86rem; font-weight: 500; }
    #feedback.ok { color: var(--color-success); }
    #feedback.erro { color: var(--color-danger); }
    #listaAvaliacoes { list-style: none; }
    .aval-item { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: .75rem; }
    .aval-item:last-child { border-bottom: none; }
    .aval-linha1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
    .aval-Partes { font-size: .98rem; font-weight: 600; color: var(--text-main); }
    .aval-Partes span { font-weight: 400; color: var(--text-muted); font-size: .82rem; }
    .aval-meta { font-size: .78rem; color: var(--text-muted); margin-top: 2px; }
    .aval-direita { display: flex; align-items: center; gap: .6rem; }
    .aval-valor { background: var(--primary-subtle); color: var(--primary-deep); font-weight: 700; padding: .25rem .75rem; border-radius: var(--radius-full); font-size: .9rem; }
    .badge-status { font-size: .72rem; font-weight: 700; padding: .2rem .6rem; border-radius: var(--radius-full); text-transform: uppercase; }
    .badge-status.PENDENTE { background: #fef3c7; color: var(--primary-deep); }
    .badge-status.APROVADA { background: #d1fae5; color: #065f46; }
    .badge-status.RECUSADA { background: var(--color-danger-bg); color: var(--color-danger); }
    .badge-status.CANCELADA { background: #f3f4f6; color: var(--text-muted); }
    .bloco-texto { background: var(--bg-page); border-left: 3px solid var(--border-yellow); padding: .55rem .8rem; border-radius: var(--radius-sm); font-size: .85rem; color: var(--text-secondary); }
    .bloco-texto strong { color: var(--text-main); }
    .aval-controles { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-top: .2rem; }
    .aval-controles input[type=text] { flex: 1; min-width: 220px; padding: .5rem .7rem; border: 1px solid var(--border-yellow); border-radius: var(--radius-sm); font: inherit; font-size: .86rem; }
    .btn-aprovar, .btn-recusar { padding: .5rem 1rem; border-radius: var(--radius-sm); font-weight: 600; font-size: .84rem; cursor: pointer; border: 1px solid transparent; }
    .btn-aprovar { background: var(--color-success); color: #fff; }
    .btn-recusar { background: #fff; color: var(--color-danger); border-color: #fecaca; }
    .btn-recusar:hover { background: var(--color-danger-bg); }
    .btn-aprovar:disabled, .btn-recusar:disabled { opacity: .6; cursor: wait; }
    .msg-bloco { padding: 2.25rem 1.5rem; text-align: center; color: var(--text-muted); }
    #erroGeral { color: var(--color-danger); background: var(--color-danger-bg); }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="dev-menu.html" class="brand-wrapper" title="Moeda Estudantil">
        <div class="brand-logo-container"><img src="assets/logo.svg" alt="Moeda Estudantil" class="brand-logo"></div>
        <div class="brand-text">
          <span class="brand-title">Moeda<span>Estudantil</span></span>
          <span class="brand-subtitle">Portal do Professor</span>
        </div>
      </a>
    </div>
  </header>

  <main class="aval-wrap">
    <div id="loading" class="msg-bloco aval-card">Carregando solicitações...</div>
    <div id="erroGeral" class="msg-bloco aval-card" style="display:none;"></div>

    <section id="conteudo" class="aval-card" style="display:none;">
      <div class="aval-topo">
        <div>
          <h1>Gestão de Transferências entre Alunos</h1>
          <small>Avalie as solicitações de transferência direcionadas a você</small>
        </div>
        <a id="linkCriterios" href="criterios-professor.html" class="link-criterios">Meus critérios de transferência</a>
      </div>

      <div class="aval-barra">
        <div>
          <label for="filtroStatus" style="font-size:.85rem;font-weight:600;margin-right:.4rem;">Exibir:</label>
          <select id="filtroStatus">
            <option value="PENDENTE" selected>Pendentes de avaliação</option>
            <option value="APROVADA">Aprovadas</option>
            <option value="RECUSADA">Recusadas</option>
            <option value="">Todas</option>
          </select>
        </div>
        <span id="feedback"></span>
      </div>

      <ul id="listaAvaliacoes"></ul>
      <div id="vazio" class="msg-bloco" style="display:none;">Nenhuma solicitação encontrada para este filtro.</div>
    </section>
  </main>

  <script src="js/core/http.js"></script>
  <script src="js/core/format.js"></script>
  <script src="js/transferencia-api.js"></script>
  <script src="js/avaliar-transferencias.js"></script>
</body>
</html>
