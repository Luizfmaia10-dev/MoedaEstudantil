<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente da moeda externa -->
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Gradiente de relevo e brilho da moeda -->
    <linearGradient id="goldShine" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Gradiente do fundo interno da moeda -->
    <radialGradient id="goldCore" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>

    <!-- Sombra suave para profundidade -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#92400E" flood-opacity="0.35" />
    </filter>

    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#78350F" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Círculo base da Moeda com Sombra -->
  <g filter="url(#softShadow)">
    <!-- Borda externa estriada/chanfrada -->
    <circle cx="100" cy="100" r="92" fill="url(#goldOuter)" stroke="#78350F" stroke-width="2" />
    
    <!-- Ranhuras da moeda (efeito cunhado) -->
    <circle cx="100" cy="100" r="87" fill="none" stroke="#FEF08A" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.85" />
    
    <!-- Anel interno intermediário -->
    <circle cx="100" cy="100" r="82" fill="url(#goldShine)" stroke="#B45309" stroke-width="1.5" />
    
    <!-- Borda frisada interior -->
    <circle cx="100" cy="100" r="74" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7" />

    <!-- Núcleo central da Moeda -->
    <circle cx="100" cy="100" r="71" fill="url(#goldCore)" stroke="#D97706" stroke-width="1" />
  </g>

  <!-- Símbolo de Aprendizado e Mérito (Livro Aberto + Capelo / Chapéu de Formatura) -->
  <g filter="url(#symbolShadow)" id="symbol-education">
    <!-- Livro Aberto de Sabedoria na base da moeda -->
    <!-- Páginas Esquerdas (Branco puro com sombreado) -->
    <path d="M 62 126 C 72 122 84 122 96 128 L 96 148 C 84 142 72 142 62 146 Z" 
          fill="#FFFFFF" stroke="#B45309" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M 64 129 C 74 125 84 125 94 130" 
          fill="none" stroke="#E5E7EB" stroke-width="1" />
    <path d="M 65 134 C 74 130 84 130 94 135" 
          fill="none" stroke="#E5E7EB" stroke-width="1" />
    <path d="M 66 139 C 74 135 84 135 94 140" 
          fill="none" stroke="#E5E7EB" stroke-width="1" />

    <!-- Páginas Direitas (Branco com detalhe dourado) -->
    <path d="M 138 126 C 128 122 116 122 104 128 L 104 148 C 116 142 128 142 138 146 Z" 
          fill="#FFFFFF" stroke="#B45309" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M 136 129 C 126 125 116 125 106 130" 
          fill="none" stroke="#E5E7EB" stroke-width="1" />
    <path d="M 135 134 C 126 130 116 130 106 135" 
          fill="none" stroke="#E5E7EB" stroke-width="1" />
    <path d="M 134 139 C 126 135 116 135 106 140" 
          fill="none" stroke="#E5E7EB" stroke-width="1" />

    <!-- Centro / Lombada do livro -->
    <path d="M 96 128 L 100 130 L 104 128 L 104 148 L 100 150 L 96 148 Z" 
          fill="#D97706" />

    <!-- Capelo / Chapéu de Formatura Acadêmico acima do livro -->
    <!-- Base craniana do capelo -->
    <path d="M 76 92 C 76 104 124 104 124 92 L 122 84 C 110 88 90 88 78 84 Z" 
          fill="#1E293B" stroke="#0F172A" stroke-width="1" />
    <path d="M 80 92 C 86 100 114 100 120 92" 
          fill="none" stroke="#FBBF24" stroke-width="1.5" />

    <!-- Losango superior do capelo (Mesa do Capelo) -->
    <polygon points="100,58 145,74 100,90 55,74" 
             fill="#0F172A" stroke="#334155" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Destaque de luz no topo do capelo -->
    <polygon points="100,61 140,74 100,87 60,74" 
             fill="#1E293B" opacity="0.6" />

    <!-- Botão central dourado do Capelo -->
    <circle cx="100" cy="74" r="4" fill="#FDE047" stroke="#B45309" stroke-width="1" />

    <!-- Pingente / Barrete / Tassel do Capelo caindo para a esquerda -->
    <path d="M 100 74 Q 85 75 70 82 Q 62 88 60 98" 
          fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Franja do Barrete -->
    <polygon points="57,98 63,98 64,110 56,110" 
             fill="#D97706" stroke="#92400E" stroke-width="0.8" />
    <circle cx="60" cy="98" r="2.5" fill="#FEF08A" />

    <!-- Brilho / Estrela de Mérito e Conhecimento no canto superior direito -->
    <g transform="translate(132, 54)">
      <!-- Estrela de 4 pontas dourada -->
      <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 -11 Z" 
            fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" />
      <circle cx="0" cy="0" r="2" fill="#FBBF24" />
    </g>

    <!-- Pequeno brilho secundário à esquerda -->
    <g transform="translate(68, 56) scale(0.6)">
      <path d="M 0 -9 Q 0 0 9 0 Q 0 0 0 9 Q 0 0 -9 0 Q 0 0 0 -9 Z" 
            fill="#FFFFFF" stroke="#F59E0B" stroke-width="1" />
    </g>
  </g>
</svg>
