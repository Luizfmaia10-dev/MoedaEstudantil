spring.application.name=moedaEstudantil

# Carrega variaveis de ambiente do arquivo .env (na raiz do projeto ou em src/.env)
spring.config.import=optional:file:.env[.properties],optional:file:src/.env[.properties]

# Configuracoes de Conexao com o MySQL (Altere a senha e o nome do banco se necessario)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Estrategia de geracao de tabelas do Hibernate (JPA)
# 'update' atualiza a estrutura do banco sem apagar os dados.
# 'create-drop' apaga e recria tudo ao iniciar (util para testes com o data.sql)
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL gerado no console para te ajudar a debugar
spring.jpa.show-sql=true

# Instrucoes para o Spring Boot rodar o data.sql sempre que a aplicacao iniciar
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Upload de imagens das vantagens (RF-008)
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Expoe a mensagem dos erros HTTP (ex.: validacoes de vantagem) para o frontend
server.error.include-message=always

# Emails de distribuicao e resgate. Selecione resend para usar a API ou smtp para servidor local.
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.resend.api-key=${RESEND_API_KEY:}
app.mail.timeout=${MAIL_TIMEOUT:10s}
app.mail.delivery-enabled=${MAIL_DELIVERY_ENABLED:true}
app.mail.poll-interval-ms=${MAIL_POLL_INTERVAL_MS:1000}
app.mail.initial-delay-ms=${MAIL_INITIAL_DELAY_MS:5000}
# SMTP local (Mailpit/MailHog) ou servidor autenticado.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:onboarding@resend.dev}

# Assistente local de transferência por linguagem natural (sem chave de API).
app.ai.ollama.url=${OLLAMA_URL:http://localhost:11434}
app.ai.ollama.model=${OLLAMA_MODEL:qwen2.5:0.5b-instruct}
app.ai.ollama.timeout=${OLLAMA_TIMEOUT:8s}

# Evita bloquear o processador indefinidamente ao usar SMTP.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
