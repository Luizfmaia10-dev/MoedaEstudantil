spring.application.name=moedaEstudantil

# Carrega variaveis de ambiente do arquivo .env (na raiz do projeto ou em src/.env)
spring.config.import=optional:file:.env[.properties],optional:file:src/.env[.properties]

# Configuracoes de Conexao com o MySQL (Altere a senha e o nome do banco se necessario)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Estrategia de geracao de tabelas do Hibernate (JPA)
# 'update' atualiza a estrutura do banco sem apagar os dados.
# 'create-drop' apaga e recria tudo ao iniciar (util para testes com o data.sql)
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL gerado no console para te ajudar a debugar
spring.jpa.show-sql=true

# Instrucoes para o Spring Boot rodar o data.sql sempre que a aplicacao iniciar
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Upload de imagens das vantagens (RF-008)
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Expoe a mensagem dos erros HTTP (ex.: validacoes de vantagem) para o frontend
server.error.include-message=always
