spring.application.name=moedaEstudantil

# Configurações de Conexão com o MySQL (Altere a senha e o nome do banco se necessário)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Estratégia de geração de tabelas do Hibernate (JPA)
# 'update' atualiza a estrutura do banco sem apagar os dados. 
# 'create-drop' apaga e recria tudo ao iniciar (útil para testes com o data.sql)
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL gerado no console para te ajudar a debugar
spring.jpa.show-sql=true

# Instruções para o Spring Boot rodar o data.sql sempre que a aplicação iniciar
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# Upload de imagens das vantagens (RF-008)
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Expoe a mensagem dos erros HTTP (ex.: validacoes de vantagem) para o frontend
server.error.include-message=always

# SMTP para RF-005, RF-009 e RF-010. Os padroes atendem a um servidor local (ex.: MailHog).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:nao-responda@moeda-estudantil.local}

# Assistente local de transferência por linguagem natural (sem chave de API).
app.ai.ollama.url=${OLLAMA_URL:http://localhost:11434}
app.ai.ollama.model=${OLLAMA_MODEL:qwen2.5:0.5b-instruct}
app.ai.ollama.timeout=${OLLAMA_TIMEOUT:8s}
