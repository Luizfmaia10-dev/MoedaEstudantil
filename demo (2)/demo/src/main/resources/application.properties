spring.application.name=moedaEstudantil

# Configurações de Conexão com o MySQL (Altere a senha e o nome do banco se necessário)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Estratégia de geração de tabelas do Hibernate (JPA)
# 'update' atualiza a estrutura do banco sem apagar os dados. 
# 'create-drop' apaga e recria tudo ao iniciar (útil para testes com o data.sql)
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL gerado no console para te ajudar a debugar
spring.jpa.show-sql=true

# Instruções para o Spring Boot rodar o data.sql sempre que a aplicação iniciar
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true