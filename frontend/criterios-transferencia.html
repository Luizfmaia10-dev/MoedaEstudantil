<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moeda Estudantil - Critérios dos Professores</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/interactions.css">
  <style>
    .lista-wrap { max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    .lista-wrap h1 { font-size: 1.25rem; color: var(--primary-deep); }
    .lista-wrap .sub { color: var(--text-muted); font-size: .85rem; margin: .2rem 0 1rem; }
    #busca { width: 100%; padding: .55rem .7rem; border: 1px solid var(--border-yellow); border-radius: var(--radius-md); margin-bottom: 1rem; font: inherit; }
    #lista { list-style: none; display: flex; flex-direction: column; gap: .85rem; }
    .prof-card { background: var(--bg-white); border: 1px solid var(--border-yellow); border-radius: var(--radius-lg); padding: 1rem 1.2rem; box-shadow: var(--shadow-sm); }
    .prof-card h3 { font-size: 1rem; }
    .prof-card .depto { font-size: .78rem; color: var(--text-muted); margin-bottom: .6rem; }
    .prof-card p { white-space: pre-wrap; font-size: .9rem; color: var(--text-secondary); }
    .msg { text-align: center; padding: 2rem; color: var(--text-muted); }
    #erro { color: var(--color-danger); }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="painel.html" class="brand-wrapper" title="Voltar ao meu painel">
        <div class="brand-logo-container"><img src="assets/logo.svg" alt="Moeda Estudantil" class="brand-logo"></div>
        <div class="brand-text">
          <span class="brand-title">Moeda<span>Estudantil</span></span>
          <span class="brand-subtitle">Portal do Aluno</span>
        </div>
      </a>
    </div>
  </header>

  <main class="lista-wrap">
    <h1>Critérios de Transferência</h1>
    <p class="sub">Consulte os critérios dos professores da sua instituição antes de solicitar uma transferência de moedas.</p>

    <input type="search" id="busca" placeholder="Buscar professor por nome ou departamento" style="display:none;">

    <div id="loading" class="msg">Carregando...</div>
    <div id="erro" class="msg" style="display:none;"></div>
    <div id="vazio" class="msg" style="display:none;">Nenhum professor da sua instituição publicou critérios ainda.</div>
    <ul id="lista"></ul>
  </main>

  <script src="js/core/http.js"></script>
  <script src="js/core/format.js"></script>
  <script src="js/criterios-api.js"></script>
  <script src="js/criterios-aluno.js"></script>
</body>
</html>
